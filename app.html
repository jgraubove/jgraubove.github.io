<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>GLB Dust Simulator</title>

<style>

:root{

    --bg-color:#1a1a1a;

    --panel-bg:rgba(30,30,30,0.95);

    --text-color:#e0e0e0;

    --accent-color:#4caf50;

    --border-color:#444;
}

body{

    margin:0;

    overflow:hidden;

    background:var(--bg-color);

    color:var(--text-color);

    font-family:Segoe UI, Arial, sans-serif;
}

#ui-panel{

    position:absolute;

    top:20px;

    left:20px;

    width:280px;

    padding:24px;

    background:var(--panel-bg);

    border-radius:12px;

    border:1px solid var(--border-color);

    z-index:100;
}

h2{

    margin:0 0 20px 0;

    color:white;
}

#drop-zone{

    border:2px dashed #555;

    border-radius:8px;

    padding:25px 15px;

    text-align:center;

    margin-bottom:20px;

    cursor:pointer;

    transition:0.2s;
}

#drop-zone.drag-over{

    border-color:var(--accent-color);

    background:rgba(76,175,80,0.15);
}

.checkbox-wrapper{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:20px;
}

.control-group{

    margin-bottom:20px;
}

label{

    display:block;

    margin-bottom:8px;

    font-size:0.9rem;
}

select{

    width:100%;

    padding:8px;

    background:#2a2a2a;

    color:#fff;

    border:1px solid #444;

    border-radius:4px;

    margin-bottom:10px;
}

input[type="range"]{

    width:100%;

    margin-bottom:5px;
}

.value-display{

    float:right;

    color:var(--accent-color);

    font-weight:bold;
}

small{

    color:#888;
}

#status{

    font-size:0.85rem;

    color:#aaa;

    border-top:1px solid #333;

    padding-top:10px;
}

#deltaEPanel{

    position:absolute;

    right:20px;

    bottom:20px;

    width:340px;

    background:rgba(30,30,30,0.95);

    border:1px solid #444;

    border-radius:12px;

    padding:16px;

    z-index:100;
}

#deltaEStats{

    margin-bottom:10px;

    font-size:14px;

    color:#fff;
}

#histogramCanvas{

    width:100%;

    height:180px;

    background:#181818;

    border-radius:8px;
}

</style>


<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

</head>

<body>


<div id="ui-panel">

    <h2>Dust Simulator</h2>

    <div id="drop-zone">

        <p>Drag & Drop .GLB</p>

        <small>
            Drop a model to replace the default
        </small>

    </div>


    <div class="checkbox-wrapper">

        <input
            type="checkbox"
            id="dustToggle"
        >

        <label for="dustToggle">
            Enable Dust
        </label>

    </div>


    <div class="control-group">

        <label for="dustColorSelect">

            Dust Type

        </label>

        <select id="dustColorSelect">

            <option value="soot">
                Soot (Black)
            </option>

            <option value="indoor">
                Indoor Dust
            </option>

        </select>

    </div>


    <div class="control-group">

        <label>

            Monthly Coverage Rate

            <span
                id="rateVal"
                class="value-display"
            >
                1%
            </span>

        </label>

        <input
            type="range"
            id="rateSlider"
            min="1"
            max="10"
            step="0.1"
            value="1"
        >

        <small>
            % surface accumulation per month
        </small>

    </div>


    <div class="control-group">

        <label>

            Time Passed

            <span
                id="timeVal"
                class="value-display"
            >
                0 Years
            </span>

        </label>

        <input
            type="range"
            id="timeSlider"
            min="0"
            max="5"
            step="0.1"
            value="0"
        >

        <small>
            Years of accumulation
        </small>

    </div>


    <div id="status">

        Loading...

    </div>

</div>


<div id="deltaEPanel">

    <div id="deltaEStats">

        ΔE > 1.5 Surface: 0%

    </div>

    <canvas
        id="histogramCanvas"
        width="320"
        height="180"
    ></canvas>

</div>



<script type="module">

import * as THREE from 'three';

import {
    OrbitControls
}
from 'three/addons/controls/OrbitControls.js';

import {
    GLTFLoader
}
from 'three/addons/loaders/GLTFLoader.js';


// ======================================================
// DEFAULT MODEL
// ======================================================

const DEFAULT_MODEL =
    'https://jgraubove.github.io/model.glb';


// ======================================================
// SCENE
// ======================================================

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x1a1a1a);


// ======================================================
// CAMERA
// ======================================================

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth
            / window.innerHeight,
        0.01,
        1000
    );

camera.position.set(3,3,5);


// ======================================================
// RENDERER
// ======================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


// ======================================================
// CONTROLS
// ======================================================

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;


// ======================================================
// LIGHTING
// ======================================================

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1.2
    )
);

const dir1 =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

dir1.position.set(5,10,5);

scene.add(dir1);

const dir2 =
    new THREE.DirectionalLight(
        0xffffff,
        1
    );

dir2.position.set(-5,5,-5);

scene.add(dir2);


// ======================================================
// UI
// ======================================================

const dropZone =
    document.getElementById('drop-zone');

const dustToggle =
    document.getElementById('dustToggle');

const dustColorSelect =
    document.getElementById('dustColorSelect');

const rateSlider =
    document.getElementById('rateSlider');

const rateVal =
    document.getElementById('rateVal');

const timeSlider =
    document.getElementById('timeSlider');

const timeVal =
    document.getElementById('timeVal');

const statusDiv =
    document.getElementById('status');

const histogramCanvas =
    document.getElementById(
        'histogramCanvas'
    );

const histCtx =
    histogramCanvas.getContext('2d');

const deltaEStats =
    document.getElementById(
        'deltaEStats'
    );


// ======================================================
// STATE
// ======================================================

let currentModel = null;


// ======================================================
// DUST COLORS
// ======================================================

const DUST_COLORS = {

    soot:
        new THREE.Color(
            0.02,
            0.02,
            0.02
        ),

    indoor:
        new THREE.Color(
            0.42,
            0.38,
            0.32
        )
};


// ======================================================
// STATUS
// ======================================================

function setStatus(msg, type="neutral"){

    statusDiv.textContent = msg;

    if(type === "error"){

        statusDiv.style.color =
            "#ff6b6b";
    }
    else if(type === "success"){

        statusDiv.style.color =
            "#4caf50";
    }
    else{

        statusDiv.style.color =
            "#aaa";
    }
}


// ======================================================
// COLOR SCIENCE
// ======================================================

function rgbToLab(color){

    function pivot(n){

        return n > 0.008856
            ? Math.pow(n,1/3)
            : (7.787 * n) + 16/116;
    }

    let r = color.r;
    let g = color.g;
    let b = color.b;

    r = r > 0.04045
        ? Math.pow((r+0.055)/1.055,2.4)
        : r/12.92;

    g = g > 0.04045
        ? Math.pow((g+0.055)/1.055,2.4)
        : g/12.92;

    b = b > 0.04045
        ? Math.pow((b+0.055)/1.055,2.4)
        : b/12.92;

    let x =
        (r*0.4124 + g*0.3576 + b*0.1805)
        / 0.95047;

    let y =
        (r*0.2126 + g*0.7152 + b*0.0722);

    let z =
        (r*0.0193 + g*0.1192 + b*0.9505)
        / 1.08883;

    x = pivot(x);
    y = pivot(y);
    z = pivot(z);

    return {

        L:(116*y)-16,

        a:500*(x-y),

        b:200*(y-z)
    };
}

function deltaE76(c1,c2){

    const lab1 = rgbToLab(c1);

    const lab2 = rgbToLab(c2);

    return Math.sqrt(

        Math.pow(lab1.L-lab2.L,2)

        +

        Math.pow(lab1.a-lab2.a,2)

        +

        Math.pow(lab1.b-lab2.b,2)
    );
}


// ======================================================
// SHADER
// ======================================================

function injectDustShader(material){

    if(material.userData.dustInjected)
        return;

    material.userData.dustInjected = true;

    material.userData.dustUniforms = {

        uDustOpacity: {
            value: 0.0
        },

        uDustColor: {
            value: DUST_COLORS.soot.clone()
        }
    };

    material.onBeforeCompile = (shader)=>{

        shader.uniforms.uDustOpacity =
            material.userData.dustUniforms.uDustOpacity;

        shader.uniforms.uDustColor =
            material.userData.dustUniforms.uDustColor;

        shader.vertexShader =
            shader.vertexShader.replace(
                '#include <common>',
                `
                #include <common>

                varying vec3 vWorldNormal;
                `
            );

        shader.vertexShader =
            shader.vertexShader.replace(
                '#include <beginnormal_vertex>',
                `
                #include <beginnormal_vertex>

                vWorldNormal =
                    normalize(
                        mat3(modelMatrix)
                        * objectNormal
                    );
                `
            );

        shader.fragmentShader =
            shader.fragmentShader.replace(
                '#include <common>',
                `
                #include <common>

                varying vec3 vWorldNormal;

                uniform float uDustOpacity;

                uniform vec3 uDustColor;
                `
            );

        shader.fragmentShader =
            shader.fragmentShader.replace(
                '#include <dithering_fragment>',
                `
                float upwardness =
                    max(vWorldNormal.y,0.0);

                float dustFactor =
                    clamp(
                        upwardness
                        * uDustOpacity,
                        0.0,
                        1.0
                    );

                gl_FragColor.rgb *=
                    (1.0 - dustFactor);

                gl_FragColor.rgb +=
                    uDustColor
                    * dustFactor;

                #include <dithering_fragment>
                `
            );
    };

    material.needsUpdate = true;
}


// ======================================================
// OPACITY
// ======================================================

function calculateTotalOpacity(){

    const rate =
        parseFloat(rateSlider.value);

    const years =
        parseFloat(timeSlider.value);

    const months = years * 12.0;

    let total =
        (rate * months) / 100.0;

    return Math.min(total,1.0);
}


// ======================================================
// HISTOGRAM
// ======================================================

function drawHistogram(bins){

    const w =
        histogramCanvas.width;

    const h =
        histogramCanvas.height;

    histCtx.clearRect(0,0,w,h);

    histCtx.fillStyle =
        '#181818';

    histCtx.fillRect(0,0,w,h);


    // =========================================
    // REMOVE EMPTY BINS
    // =========================================

    const filtered = [];

    for(let i=1;i<bins.length;i++){

        if(bins[i] > 0){

            filtered.push({

                value: bins[i],

                index: i
            });
        }
    }

    // Nothing to draw
    if(filtered.length === 0){

        histCtx.fillStyle =
            '#888';

        histCtx.font =
            '14px Segoe UI';

        histCtx.fillText(
            'No visible ΔE distribution',
            20,
            40
        );

        return;
    }


    // =========================================
    // GRAPH SCALING
    // =========================================

    const max =
        Math.max(
            ...filtered.map(b=>b.value)
        );

    const barWidth =
        w / filtered.length;


    // =========================================
    // DRAW BARS
    // =========================================

    filtered.forEach((bin,i)=>{

        const barHeight =
            (bin.value / max)
            * (h - 50);

        // Highlight bins above ΔE 1.5
        histCtx.fillStyle =
            bin.index > 1
            ? '#4caf50'
            : '#666';

        histCtx.fillRect(

            i * barWidth + 2,

            h - barHeight - 25,

            barWidth - 4,

            barHeight
        );


        // Bin labels
        histCtx.fillStyle =
            '#aaa';

        histCtx.font =
            '10px Segoe UI';

        histCtx.fillText(

            bin.index.toString(),

            i * barWidth + 4,

            h - 8
        );
    });


    // =========================================
    // TITLE
    // =========================================

    histCtx.fillStyle =
        '#fff';

    histCtx.font =
        '13px Segoe UI';

    histCtx.fillText(
        'ΔE Distribution',
        10,
        16
    );


    // =========================================
    // THRESHOLD LINE
    // =========================================

    for(let i=0;i<filtered.length;i++){

        if(filtered[i].index >= 2){

            const x =
                i * barWidth;

            histCtx.strokeStyle =
                '#ffffff44';

            histCtx.beginPath();

            histCtx.moveTo(x,25);

            histCtx.lineTo(x,h-20);

            histCtx.stroke();

            histCtx.fillStyle =
                '#fff';

            histCtx.font =
                '11px Segoe UI';

            histCtx.fillText(
                'ΔE 1.5',
                x + 4,
                36
            );

            break;
        }
    }
}


// ======================================================
// DELTA E ANALYSIS
// ======================================================

function updateDeltaEAnalysis(){

    if(!currentModel) return;

    const enabled =
        dustToggle.checked;

    if(!enabled){

        deltaEStats.textContent =
            'ΔE > 1.5 Surface: 0%';

        drawHistogram(
            new Array(20).fill(0)
        );

        return;
    }

    const opacity =
        calculateTotalOpacity();

    const dustColor =
        DUST_COLORS[
            dustColorSelect.value
        ];

    const bins =
        new Array(20).fill(0);

    let aboveThreshold = 0;

    let totalSamples = 0;

    currentModel.traverse((child)=>{

        if(!child.isMesh) return;

        const geometry =
            child.geometry;

        const normals =
            geometry.attributes.normal;

        if(!normals) return;

        const materials =
            Array.isArray(child.material)
            ? child.material
            : [child.material];

        materials.forEach((material)=>{

            const baseColor =
                material.color
                ? material.color.clone()
                : new THREE.Color(1,1,1);

            for(
                let i=0;
                i<normals.count;
                i+=5
            ){

                const ny =
                    normals.getY(i);

                const upwardness =
                    Math.max(ny,0);

                const dustFactor =
                    Math.min(
                        upwardness * opacity,
                        1.0
                    );

                const dusted =
                    baseColor.clone()
                    .lerp(
                        dustColor,
                        dustFactor
                    );

                const dE =
                    deltaE76(
                        baseColor,
                        dusted
                    );

                const bin =
                    Math.min(
                        100,
                        Math.floor(dE)
                    );

                bins[bin]++;

                if(dE > 1.5){

                    aboveThreshold++;
                }

                totalSamples++;
            }
        });
    });

    const percentage =
        totalSamples > 0
        ? (
            aboveThreshold
            / totalSamples
        ) * 100
        : 0;

    deltaEStats.textContent =
        `ΔE > 1.5 Surface: ${percentage.toFixed(1)}%`;

    drawHistogram(bins);
}


// ======================================================
// CLEAR MODEL
// ======================================================

function clearCurrentModel(){

    if(!currentModel) return;

    scene.remove(currentModel);

    currentModel.traverse((child)=>{

        if(!child.isMesh) return;

        child.geometry.dispose();

        const materials =
            Array.isArray(child.material)
            ? child.material
            : [child.material];

        materials.forEach((m)=>{

            if(m.map) m.map.dispose();

            m.dispose();
        });
    });
}


// ======================================================
// PROCESS MODEL
// ======================================================

function processLoadedModel(model){

    clearCurrentModel();

    currentModel = model;

    currentModel.traverse((child)=>{

        if(!child.isMesh) return;

        child.castShadow = true;

        child.receiveShadow = true;

        child.geometry.computeVertexNormals();

        const materials =
            Array.isArray(child.material)
            ? child.material
            : [child.material];

        materials.forEach((material)=>{

            if(
                material.isMeshStandardMaterial
                ||
                material.isMeshPhysicalMaterial
            ){
                injectDustShader(material);
            }
        });
    });

    centerAndFrameModel(currentModel);

    scene.add(currentModel);

    applyDustEffect();
}


// ======================================================
// LOAD GLB
// ======================================================

function loadGLB(path,label="Model"){

    setStatus(`Loading ${label}...`);

    const loader = new GLTFLoader();

    loader.load(

        path,

        (gltf)=>{

            processLoadedModel(
                gltf.scene
            );

            setStatus(
                `${label} loaded`,
                "success"
            );
        },

        undefined,

        (err)=>{

            console.error(err);

            setStatus(
                `Failed to load ${label}`,
                "error"
            );
        }
    );
}


// ======================================================
// FRAME MODEL
// ======================================================

function centerAndFrameModel(model){

    const box =
        new THREE.Box3()
        .setFromObject(model);

    const center =
        box.getCenter(
            new THREE.Vector3()
        );

    const size =
        box.getSize(
            new THREE.Vector3()
        );

    model.position.sub(center);

    const maxDim =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    const distance =
        maxDim * 1.8;

    camera.position.set(
        distance,
        distance,
        distance
    );

    camera.near = maxDim / 100;

    camera.far = maxDim * 100;

    camera.updateProjectionMatrix();

    controls.target.set(0,0,0);

    controls.update();
}


// ======================================================
// APPLY DUST
// ======================================================

function applyDustEffect(){

    if(!currentModel) return;

    const enabled =
        dustToggle.checked;

    const opacity =
        enabled
        ? calculateTotalOpacity()
        : 0.0;

    const dustColor =
        DUST_COLORS[
            dustColorSelect.value
        ];

    currentModel.traverse((child)=>{

        if(!child.isMesh) return;

        const materials =
            Array.isArray(child.material)
            ? child.material
            : [child.material];

        materials.forEach((material)=>{

            if(material.userData.dustUniforms){

                material.userData
                    .dustUniforms
                    .uDustOpacity
                    .value = opacity;

                material.userData
                    .dustUniforms
                    .uDustColor
                    .value
                    .copy(dustColor);
            }
        });
    });

    updateDeltaEAnalysis();
}


// ======================================================
// DRAG + DROP
// ======================================================

[
    'dragenter',
    'dragover',
    'dragleave',
    'drop'
].forEach((eventName)=>{

    dropZone.addEventListener(
        eventName,
        (e)=>{

            e.preventDefault();

            e.stopPropagation();
        },
        false
    );
});

[
    'dragenter',
    'dragover'
].forEach((eventName)=>{

    dropZone.addEventListener(
        eventName,
        ()=>{

            dropZone.classList.add(
                'drag-over'
            );
        },
        false
    );
});

[
    'dragleave',
    'drop'
].forEach((eventName)=>{

    dropZone.addEventListener(
        eventName,
        ()=>{

            dropZone.classList.remove(
                'drag-over'
            );
        },
        false
    );
});

dropZone.addEventListener(
    'drop',
    (e)=>{

        const file =
            e.dataTransfer.files[0];

        if(!file) return;

        if(
            !file.name
            .toLowerCase()
            .endsWith('.glb')
        ){

            setStatus(
                "Please drop a GLB file",
                "error"
            );

            return;
        }

        const url =
            URL.createObjectURL(file);

        loadGLB(url,file.name);
    }
);


// ======================================================
// UI EVENTS
// ======================================================

dustToggle.addEventListener(
    'change',
    applyDustEffect
);

dustColorSelect.addEventListener(
    'change',
    applyDustEffect
);

rateSlider.addEventListener(
    'input',
    (e)=>{

        rateVal.textContent =
            e.target.value + "%";

        applyDustEffect();
    }
);

timeSlider.addEventListener(
    'input',
    (e)=>{

        timeVal.textContent =
            e.target.value + " Years";

        applyDustEffect();
    }
);


// ======================================================
// RESIZE
// ======================================================

window.addEventListener(
    'resize',
    ()=>{

        camera.aspect =
            window.innerWidth
            / window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


// ======================================================
// START
// ======================================================

loadGLB(
    DEFAULT_MODEL,
    "Default model"
);


// ======================================================
// LOOP
// ======================================================

function animate(){

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(scene,camera);
}

animate();

</script>

</body>
</html>
