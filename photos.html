<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Environmental Degradation Simulator</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --accent-color: #ff4757;
            --panel-bg: #2d2d2d;
            --border-color: #444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 400;
        }

        /* Controls Area */
        .controls {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .drop-area {
            border: 2px dashed var(--border-color);
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            position: relative;
        }

        .drop-area:hover, .drop-area.dragover {
            border-color: var(--accent-color);
            background-color: rgba(255, 71, 87, 0.1);
        }

        .drop-area p {
            margin: 0;
            font-size: 0.9rem;
            color: #aaa;
        }

        input[type="file"] {
            display: none;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .slider-val {
            color: var(--accent-color);
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        /* Canvas Container for Zoom/Pan */
        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 60vh;
            background-color: #000;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }

        .canvas-wrapper:active {
            cursor: grabbing;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transform-origin: center center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .status-msg {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }
        
        .note {
            font-size: 0.75rem;
            color: #666;
            margin-top: 5px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Environmental Degradation Simulator</h1>

    <div class="controls">
        <!-- Drop Area -->
        <div class="drop-area" id="dropArea">
            <p>Drag & drop an image here or click to upload</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <!-- Sliders -->
        <div class="slider-group">
            <!-- Acetic Acid -->
            <div class="slider-container">
                <div class="slider-header">
                    <label for="aaSlider">Acetic Acid (ppb)</label>
                    <span id="aaValue" class="slider-val">0</span>
                </div>
                <input type="range" id="aaSlider" min="0" max="100" value="0" step="1">
            </div>

            <!-- Temperature -->
            <div class="slider-container">
                <div class="slider-header">
                    <label for="tempSlider">Temperature (°C)</label>
                    <span id="tempValue" class="slider-val">20</span>
                </div>
                <input type="range" id="tempSlider" min="-20" max="60" value="20" step="1">
                <div class="note">Converted to Kelvin for calculation</div>
            </div>

            <!-- Relative Humidity -->
            <div class="slider-container">
                <div class="slider-header">
                    <label for="rhSlider">Relative Humidity (%)</label>
                    <span id="rhValue" class="slider-val">50</span>
                </div>
                <input type="range" id="rhSlider" min="0" max="100" value="50" step="1">
            </div>

            <!-- Time -->
            <div class="slider-container">
                <div class="slider-header">
                    <label for="timeSlider">Time (Years)</label>
                    <span id="timeValue" class="slider-val">1</span>
                </div>
                <input type="range" id="timeSlider" min="1" max="150" value="1" step="1">
            </div>
        </div>

        <!-- Download Button -->
        <button id="downloadBtn" disabled>Download Result</button>
        <div class="status-msg" id="statusMsg">Default image loaded.</div>
    </div>

    <!-- Visualization Area -->
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="mainCanvas"></canvas>
    </div>

    <script>
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const canvasWrapper = document.getElementById('canvasWrapper');
        const statusMsg = document.getElementById('statusMsg');

        // Sliders
        const aaSlider = document.getElementById('aaSlider');
        const aaValueDisplay = document.getElementById('aaValue');
        const tempSlider = document.getElementById('tempSlider');
        const tempValueDisplay = document.getElementById('tempValue');
        const rhSlider = document.getElementById('rhSlider');
        const rhValueDisplay = document.getElementById('rhValue');
        const timeSlider = document.getElementById('timeSlider');
        const timeValueDisplay = document.getElementById('timeValue');

        // State variables
        let originalImage = new Image();
        let isDragging = false;
        let startX, startY;
        let translateX = 0;
        let translateY = 0;
        let scale = 1;
        let isImageLoaded = false;

        const DEFAULT_URL = 'https://jgraubove.github.io/photo.jpg';

        // --- Initialization ---

        function init() {
            loadImage(DEFAULT_URL, 'Default image loaded.');
            setupEventListeners();
        }

        function setupEventListeners() {
            // File Upload
            dropArea.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileSelect);
            
            // Drag and Drop
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
            });
            
            dropArea.addEventListener('dragover', () => dropArea.classList.add('dragover'));
            dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
            dropArea.addEventListener('drop', handleDrop);

            // Sliders
            aaSlider.addEventListener('input', updateImage);
            tempSlider.addEventListener('input', updateImage);
            rhSlider.addEventListener('input', updateImage);
            timeSlider.addEventListener('input', updateImage);

            // Download
            downloadBtn.addEventListener('click', downloadImage);

            // Pan and Zoom
            canvasWrapper.addEventListener('mousedown', startPan);
            window.addEventListener('mousemove', pan);
            window.addEventListener('mouseup', endPan);
            canvasWrapper.addEventListener('wheel', handleZoom);
        }

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // --- Image Loading ---

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => loadImage(event.target.result, 'Custom image loaded.');
                reader.readAsDataURL(file);
            }
        }

        function handleDrop(e) {
            dropArea.classList.remove('dragover');
            const dt = e.dataTransfer;
            const file = dt.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (event) => loadImage(event.target.result, 'Custom image loaded.');
                reader.readAsDataURL(file);
            }
        }

        function loadImage(src, msg) {
            originalImage = new Image();
            originalImage.crossOrigin = "Anonymous"; 
            
            originalImage.onload = () => {
                isImageLoaded = true;
                statusMsg.textContent = msg;
                downloadBtn.disabled = false;
                
                // Reset transforms
                translateX = 0;
                translateY = 0;
                scale = 1;
                updateTransform();

                // Set canvas size to match image natural size
                canvas.width = originalImage.naturalWidth;
                canvas.height = originalImage.naturalHeight;
                
                // Initial render
                updateImage();
            };

            originalImage.onerror = () => {
                statusMsg.textContent = 'Error loading image. Using placeholder.';
                alert("Could not load the default image. Please upload your own.");
            };

            originalImage.src = src;
        }

        // --- Environmental Degradation Equations ---

        function F(AA, RH, T) {
            // T is expected to be in Kelvin
            return (
                32 +
                0.0002 * AA +
                0.01 * RH -
                11 * (1000 / T)
            );
        }

        function deltaE(t, AA, RH, T) {
            return t * Math.exp(F(AA, RH, T));
        }

        function Rt(R0, t, AA, RH, T) {
            return R0 * (1 + 0.815442 * deltaE(t, AA, RH, T));
        }

        function Gt(G0, t, AA, RH, T) {
            return G0 * (1 + 0.521962 * deltaE(t, AA, RH, T));
        }

        function Bt(B0, t, AA, RH, T) {
            return B0 * (1 + 0.250171 * deltaE(t, AA, RH, T));
        }

        // --- Image Processing ---

        function updateImage() {
            if (!isImageLoaded) return;

            // Get current slider values
            const AA = parseFloat(aaSlider.value);
            const tempC = parseFloat(tempSlider.value);
            const RH = parseFloat(rhSlider.value);
            const t = parseFloat(timeSlider.value);

            // Update displays
            aaValueDisplay.textContent = AA;
            tempValueDisplay.textContent = tempC;
            rhValueDisplay.textContent = RH;
            timeValueDisplay.textContent = t;

            // Convert Temp to Kelvin
            const T_K = tempC + 273.15;

            // Draw original image first
            ctx.drawImage(originalImage, 0, 0);

            // Get pixel data
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            // Process pixels
            for (let i = 0; i < data.length; i += 4) {
                const R0 = data[i];
                const G0 = data[i+1];
                const B0 = data[i+2];

                // Calculate new values
                let newR = Rt(R0, t, AA, RH, T_K);
                let newG = Gt(G0, t, AA, RH, T_K);
                let newB = Bt(B0, t, AA, RH, T_K);

                // Clamp values to 0-255
                data[i] = Math.max(0, Math.min(255, newR));
                data[i+1] = Math.max(0, Math.min(255, newG));
                data[i+2] = Math.max(0, Math.min(255, newB));
                // Alpha (data[i+3]) remains unchanged
            }

            // Put modified data back
            ctx.putImageData(imageData, 0, 0);
        }

        // --- Pan and Zoom Logic ---

        function startPan(e) {
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            canvas.style.cursor = 'grabbing';
        }

        function pan(e) {
            if (!isDragging) return;
            e.preventDefault();
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateTransform();
        }

        function endPan() {
            isDragging = false;
            canvas.style.cursor = 'grab';
        }

        function handleZoom(e) {
            e.preventDefault();
            const zoomIntensity = 0.1;
            const delta = e.deltaY > 0 ? -zoomIntensity : zoomIntensity;
            const newScale = scale + delta;

            if (newScale > 0.1 && newScale < 5) {
                scale = newScale;
                updateTransform();
            }
        }

        function updateTransform() {
            canvas.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        // --- Download ---

        function downloadImage() {
            if (!isImageLoaded) return;

            const link = document.createElement('a');
            link.download = 'degraded-image.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Start
        init();

    </script>
</body>
</html>
