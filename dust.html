<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>GLB Dust Simulator</title>

<style>

:root{

    --bg-color:#1a1a1a;

    --panel-bg:rgba(30,30,30,0.95);

    --text-color:#e0e0e0;

    --accent-color:#4caf50;

    --border-color:#444;
}

body{

    margin:0;

    overflow:hidden;

    background:var(--bg-color);

    color:var(--text-color);

    font-family:Segoe UI, Arial, sans-serif;
}

#ui-panel{

    position:absolute;

    top:20px;

    left:20px;

    width:280px;

    padding:24px;

    background:var(--panel-bg);

    border-radius:12px;

    border:1px solid var(--border-color);

    z-index:100;
}

h2{

    margin:0 0 20px 0;

    color:white;
}

#drop-zone{

    border:2px dashed #555;

    border-radius:8px;

    padding:25px 15px;

    text-align:center;

    margin-bottom:20px;

    cursor:pointer;

    transition:0.2s;
}

#drop-zone.drag-over{

    border-color:var(--accent-color);

    background:rgba(76,175,80,0.15);
}

.checkbox-wrapper{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:20px;
}

.control-group{

    margin-bottom:20px;
}

label{

    display:block;

    margin-bottom:8px;

    font-size:0.9rem;
}

select{

    width:100%;

    padding:8px;

    background:#2a2a2a;

    color:#fff;

    border:1px solid #444;

    border-radius:4px;

    margin-bottom:10px;
}

input[type="range"]{

    width:100%;

    margin-bottom:5px;
}

.value-display{

    float:right;

    color:var(--accent-color);

    font-weight:bold;
}

small{

    color:#888;
}

#status{

    font-size:0.85rem;

    color:#aaa;

    border-top:1px solid #333;

    padding-top:10px;
}

</style>


<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

</head>

<body>


<div id="ui-panel">

    <h2>Dust Simulator</h2>

    <div id="drop-zone">

        <p>Drag & Drop .GLB</p>

        <small>
            Drop a model to replace the default
        </small>

    </div>


    <div class="checkbox-wrapper">

        <input
            type="checkbox"
            id="dustToggle"
        >

        <label for="dustToggle">
            Enable Dust
        </label>

    </div>


    <div class="control-group">

        <label for="dustColorSelect">

            Dust Type

        </label>

        <select id="dustColorSelect">

            <option value="soot">
                Soot (Black)
            </option>

            <option value="indoor">
                Indoor Dust
            </option>

        </select>

    </div>


    <div class="control-group">

        <label>

            Monthly Coverage Rate

            <span
                id="rateVal"
                class="value-display"
            >
                1%
            </span>

        </label>

        <input
            type="range"
            id="rateSlider"
            min="1"
            max="10"
            step="0.1"
            value="1"
        >

        <small>
            % surface accumulation per month
        </small>

    </div>


    <div class="control-group">

        <label>

            Time Passed

            <span
                id="timeVal"
                class="value-display"
            >
                0 Years
            </span>

        </label>

        <input
            type="range"
            id="timeSlider"
            min="0"
            max="5"
            step="0.1"
            value="0"
        >

        <small>
            Years of accumulation
        </small>

    </div>


    <div id="status">

        Loading...

    </div>

</div>



<script type="module">

import * as THREE from 'three';

import {
    OrbitControls
}
from 'three/addons/controls/OrbitControls.js';

import {
    GLTFLoader
}
from 'three/addons/loaders/GLTFLoader.js';


// ======================================================
// DEFAULT MODEL
// ======================================================

// Put your GLB in the SAME folder as this HTML
// Example:
// index.html
// statue.glb

const DEFAULT_MODEL =
    'https://jgraubove.github.io/model.glb';


// ======================================================
// SCENE
// ======================================================

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x1a1a1a);


// ======================================================
// CAMERA
// ======================================================

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth
            / window.innerHeight,
        0.01,
        1000
    );

camera.position.set(3,3,5);


// ======================================================
// RENDERER
// ======================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


// ======================================================
// CONTROLS
// ======================================================

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;


// ======================================================
// LIGHTING
// ======================================================

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1.2
    )
);

const dir1 =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

dir1.position.set(5,10,5);

scene.add(dir1);

const dir2 =
    new THREE.DirectionalLight(
        0xffffff,
        1
    );

dir2.position.set(-5,5,-5);

scene.add(dir2);


// ======================================================
// UI
// ======================================================

const dropZone =
    document.getElementById('drop-zone');

const dustToggle =
    document.getElementById('dustToggle');

const dustColorSelect =
    document.getElementById('dustColorSelect');

const rateSlider =
    document.getElementById('rateSlider');

const rateVal =
    document.getElementById('rateVal');

const timeSlider =
    document.getElementById('timeSlider');

const timeVal =
    document.getElementById('timeVal');

const statusDiv =
    document.getElementById('status');


// ======================================================
// STATE
// ======================================================

let currentModel = null;


// ======================================================
// DUST COLORS
// ======================================================

const DUST_COLORS = {

    soot:
        new THREE.Color(
            0.02,
            0.02,
            0.02
        ),

    indoor:
        new THREE.Color(
            0.42,
            0.38,
            0.32
        )
};


// ======================================================
// STATUS
// ======================================================

function setStatus(msg, type="neutral"){

    statusDiv.textContent = msg;

    if(type === "error"){

        statusDiv.style.color =
            "#ff6b6b";
    }
    else if(type === "success"){

        statusDiv.style.color =
            "#4caf50";
    }
    else{

        statusDiv.style.color =
            "#aaa";
    }
}


// ======================================================
// SHADER
// ======================================================

function injectDustShader(material){

    if(material.userData.dustInjected)
        return;

    material.userData.dustInjected =
        true;

    material.onBeforeCompile =
    (shader)=>{

        material.userData.shader =
            shader;

        shader.uniforms.uDustOpacity = {
            value:0.0
        };

        shader.uniforms.uDustColor = {
            value:DUST_COLORS.soot
        };

        shader.vertexShader =
            shader.vertexShader.replace(
                '#include <common>',
                `
                #include <common>

                varying vec3 vWorldNormal;
                `
            );

        shader.vertexShader =
            shader.vertexShader.replace(
                '#include <beginnormal_vertex>',
                `
                #include <beginnormal_vertex>

                vWorldNormal =
                    normalize(
                        mat3(modelMatrix)
                        * objectNormal
                    );
                `
            );

        shader.fragmentShader =
            shader.fragmentShader.replace(
                '#include <common>',
                `
                #include <common>

                varying vec3 vWorldNormal;

                uniform float uDustOpacity;

                uniform vec3 uDustColor;
                `
            );

        shader.fragmentShader =
            shader.fragmentShader.replace(
                '#include <dithering_fragment>',
                `
                float upwardness =
                    max(vWorldNormal.y,0.0);

                float dustFactor =
                    clamp(
                        upwardness
                        * uDustOpacity,
                        0.0,
                        1.0
                    );

                gl_FragColor.rgb *=
                    (1.0 - dustFactor);

                gl_FragColor.rgb +=
                    uDustColor
                    * dustFactor;

                #include <dithering_fragment>
                `
            );
    };

    material.needsUpdate = true;
}


// ======================================================
// OPACITY
// ======================================================

function calculateTotalOpacity(){

    const rate =
        parseFloat(rateSlider.value);

    const years =
        parseFloat(timeSlider.value);

    const months = years * 12.0;

    let total =
        (rate * months) / 100.0;

    return Math.min(total,1.0);
}


// ======================================================
// CLEAR MODEL
// ======================================================

function clearCurrentModel(){

    if(!currentModel) return;

    scene.remove(currentModel);

    currentModel.traverse((child)=>{

        if(!child.isMesh) return;

        child.geometry.dispose();

        const materials =
            Array.isArray(child.material)
            ? child.material
            : [child.material];

        materials.forEach((m)=>{

            if(m.map) m.map.dispose();

            m.dispose();
        });
    });
}


// ======================================================
// PROCESS MODEL
// ======================================================

function processLoadedModel(model){

    clearCurrentModel();

    currentModel = model;

    currentModel.traverse((child)=>{

        if(!child.isMesh) return;

        child.castShadow = true;

        child.receiveShadow = true;

        child.geometry.computeVertexNormals();

        const materials =
            Array.isArray(child.material)
            ? child.material
            : [child.material];

        materials.forEach((material)=>{

            if(
                material.isMeshStandardMaterial
                ||
                material.isMeshPhysicalMaterial
            ){
                injectDustShader(material);
            }
        });
    });

    centerAndFrameModel(currentModel);

    scene.add(currentModel);

    applyDustEffect();
}


// ======================================================
// LOAD GLB
// ======================================================

function loadGLB(path,label="Model"){

    setStatus(`Loading ${label}...`);

    const loader = new GLTFLoader();

    loader.load(

        path,

        (gltf)=>{

            processLoadedModel(
                gltf.scene
            );

            setStatus(
                `${label} loaded`,
                "success"
            );
        },

        undefined,

        (err)=>{

            console.error(err);

            setStatus(
                `Failed to load ${label}`,
                "error"
            );
        }
    );
}


// ======================================================
// FRAME MODEL
// ======================================================

function centerAndFrameModel(model){

    const box =
        new THREE.Box3()
        .setFromObject(model);

    const center =
        box.getCenter(
            new THREE.Vector3()
        );

    const size =
        box.getSize(
            new THREE.Vector3()
        );

    model.position.sub(center);

    const maxDim =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    const distance =
        maxDim * 1.8;

    camera.position.set(
        distance,
        distance,
        distance
    );

    camera.near = maxDim / 100;

    camera.far = maxDim * 100;

    camera.updateProjectionMatrix();

    controls.target.set(0,0,0);

    controls.update();
}


// ======================================================
// APPLY DUST
// ======================================================

function applyDustEffect(){

    if(!currentModel) return;

    const enabled =
        dustToggle.checked;

    const opacity =
        enabled
        ? calculateTotalOpacity()
        : 0.0;

    const dustColor =
        DUST_COLORS[
            dustColorSelect.value
        ];

    currentModel.traverse((child)=>{

        if(!child.isMesh) return;

        const materials =
            Array.isArray(child.material)
            ? child.material
            : [child.material];

        materials.forEach((material)=>{

            if(material.userData.shader){

                material.userData.shader
                    .uniforms
                    .uDustOpacity
                    .value = opacity;

                material.userData.shader
                    .uniforms
                    .uDustColor
                    .value
                    .copy(dustColor);
            }
        });
    });
}


// ======================================================
// DRAG + DROP
// ======================================================

[
    'dragenter',
    'dragover',
    'dragleave',
    'drop'
].forEach((eventName)=>{

    dropZone.addEventListener(
        eventName,
        (e)=>{

            e.preventDefault();

            e.stopPropagation();
        },
        false
    );
});

[
    'dragenter',
    'dragover'
].forEach((eventName)=>{

    dropZone.addEventListener(
        eventName,
        ()=>{

            dropZone.classList.add(
                'drag-over'
            );
        },
        false
    );
});

[
    'dragleave',
    'drop'
].forEach((eventName)=>{

    dropZone.addEventListener(
        eventName,
        ()=>{

            dropZone.classList.remove(
                'drag-over'
            );
        },
        false
    );
});

dropZone.addEventListener(
    'drop',
    (e)=>{

        const file =
            e.dataTransfer.files[0];

        if(!file) return;

        if(
            !file.name
            .toLowerCase()
            .endsWith('.glb')
        ){

            setStatus(
                "Please drop a GLB file",
                "error"
            );

            return;
        }

        const url =
            URL.createObjectURL(file);

        loadGLB(url,file.name);
    }
);


// ======================================================
// UI EVENTS
// ======================================================

dustToggle.addEventListener(
    'change',
    applyDustEffect
);

dustColorSelect.addEventListener(
    'change',
    applyDustEffect
);

rateSlider.addEventListener(
    'input',
    (e)=>{

        rateVal.textContent =
            e.target.value + "%";

        applyDustEffect();
    }
);

timeSlider.addEventListener(
    'input',
    (e)=>{

        timeVal.textContent =
            e.target.value + " Years";

        applyDustEffect();
    }
);


// ======================================================
// RESIZE
// ======================================================

window.addEventListener(
    'resize',
    ()=>{

        camera.aspect =
            window.innerWidth
            / window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


// ======================================================
// START
// ======================================================

loadGLB(
    DEFAULT_MODEL,
    "Default model"
);


// ======================================================
// LOOP
// ======================================================

function animate(){

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(scene,camera);
}

animate();

</script>

</body>
</html>
